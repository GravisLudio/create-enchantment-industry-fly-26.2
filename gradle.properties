# Gradle
org.gradle.jvmargs = -Xmx4G
org.gradle.daemon = false
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = false

# Fabric / Minecraft
# Alineado con Create Fly 26.2-rc-2-6.0.9-1 y con el port de Create: Dragons Plus a 26.2.
minecraft_version = 26.2-rc-2
# El loader normaliza la version a semver, asi que el juego se identifica como 26.2-rc.2 (con punto)
# y no como 26.2-rc-2 (con guion) que es el id del manifest de Mojang. Declarar la version exacta en
# fabric.mod.json hace que el loader rechace el mod con "only the wrong version is present".
# Por eso la dependencia va por rango, igual que en Dragons Plus y en el port de Connected.
minecraft_version_range = >=26.2- <26.3-
java_version = 25
loader_version = 0.19.3
loom_version = 1.17.491
# Mismo pin que Dragons Plus. JEI 30.16 exige >=0.155.0+26.2; con menos el loader aborta el arranque.
fabric_api_version = 0.156.0+26.2

# Mod
mod_id = create_enchantment_industry
mod_artifact_id = create-enchantment-industry-fly
mod_name = Create: Enchantment Industry Fly
mod_license = LGPL-3.0-or-later
mod_version = 2.5.2-p1
mod_release_channel = BETA
mod_group_id = plus.dragons.createenchantmentindustry
mod_authors = DragonsPlus
mod_description = Enchantment, Experience, Enhancement and Enlightening - with Create Fly
mod_github = https://github.com/DragonsPlusMinecraft/CreateEnchantmentIndustry-Fly

# Required dependencies
create_fly_version = 26.2-rc-2-6.0.9-1
create_version_range = >=6.0.9-1 <6.1.0
# Este artefacto NO existe en maven.dragons.plus: upstream todavia no publico Dragons Plus para 26.2.
# Sale del port propio (C:\dev\create-dragons-plus-fly-26.2) via `gradlew publishToMavenLocal`,
# por eso el build agrega mavenLocal() como primer repositorio.
create_dragons_plus_version = 1.11.4-p2
jei_version = 30.16.0.132
