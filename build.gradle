plugins {
    // Mismo plugin que el port de Dragons Plus a 26.2. Desde 1.21.11-rc3 Mojang publica el juego
    // sin obfuscar: no hay client_mappings en el manifest, no hay paso de remapeo, y fabric-loom
    // falla al resolver mappings. loom-no-remap salta ese paso.
    id 'dev.architectury.loom-no-remap' version "${loom_version}"
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
    id 'com.diffplug.spotless' version '8.9.0'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_artifact_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

loom {
    splitEnvironmentSourceSets()
    // En 26.2 el formato es classTweaker v1 official, no accessWidener v2. La propiedad de loom
    // sigue llamandose accessWidenerPath y acepta el archivo nuevo.
    accessWidenerPath = file('src/main/resources/create_enchantment_industry.classtweaker')

    mods {
        create_enchantment_industry {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            name 'Create: Enchantment Industry Fly Client'
        }
        server {
            server()
            name 'Create: Enchantment Industry Fly Server'
            programArg '--nogui'
        }
        datagen {
            inherit client
            name 'Create: Enchantment Industry Fly Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources').absolutePath}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            runDir 'build/datagen'
        }
    }
}

repositories {
    // Dragons Plus 26.2 todavia no esta publicado en maven.dragons.plus; se toma del port local.
    // Correr `gradlew publishToMavenLocal` en C:\dev\create-dragons-plus-fly-26.2 antes de compilar.
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'DragonsPlus'
        url = 'https://maven.dragons.plus/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    // El artefacto fabric-api es un contenedor: 43 jars anidados, cero clases propias. Como
    // `api`/`implementation` no aporta nada al classpath de compilacion, el sintoma es
    // package-does-not-exist en cada import de fabric.api, no un error de jar faltante.
    // Los modulos que este mod realmente usa van nombrados uno por uno; la lista sale de mapear
    // los 30 imports de net.fabricmc.fabric.api.* contra los jars anidados de fabric-api.
    api fabricApi.module("fabric-data-generation-api-v1", fabric_api_version)     // datagen.v1 y datagen.v1.provider
    api fabricApi.module("fabric-events-interaction-v0", fabric_api_version)      // entity.FakePlayer
    api fabricApi.module("fabric-lifecycle-events-v1", fabric_api_version)        // event.lifecycle.v1
    api fabricApi.module("fabric-networking-api-v1", fabric_api_version)          // networking.v1 y client.networking.v1
    api fabricApi.module("fabric-object-builder-api-v1", fabric_api_version)      // object.builder.v1.block.entity
    api fabricApi.module("fabric-recipe-api-v1", fabric_api_version)              // recipe.v1.sync
    api fabricApi.module("fabric-rendering-fluids-v1", fabric_api_version)        // client.render.fluid.v1
    api fabricApi.module("fabric-resource-conditions-api-v1", fabric_api_version) // resource.conditions.v1
    api fabricApi.module("fabric-transfer-api-v1", fabric_api_version)            // transfer.v1.*
    // No se importa directo, pero las clases de transfer.v1 lo referencian en sus firmas.
    api fabricApi.module("fabric-api-lookup-api-v1", fabric_api_version)
    // Sigue haciendo falta en runtime para el resto de la API y para la metadata de JiJ.
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    api("maven.modrinth:create-fly:${create_fly_version}") { transitive = false }
    api("plus.dragons.createdragonsplus:create-dragons-plus-fly-${minecraft_version}:${create_dragons_plus_version}") {
        transitive = false
    }

    clientCompileOnly "maven.modrinth:jei:${jei_version}"
    clientRuntimeOnly "maven.modrinth:jei:${jei_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    def replaceProperties = [
            version                     : project.version,
            minecraft_version           : minecraft_version,
            minecraft_version_range     : minecraft_version_range,
            java_version                : java_version,
            loader_version              : loader_version,
            fabric_api_version          : fabric_api_version,
            create_version_range        : create_version_range,
            create_dragons_plus_version : create_dragons_plus_version,
            jei_version                 : jei_version,
            mod_id                      : mod_id,
            mod_name                    : mod_name,
            mod_license                 : mod_license,
            mod_authors                 : mod_authors,
            mod_description             : mod_description,
            mod_github                  : mod_github,
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.withType(Jar).configureEach {
    from 'LICENSE.txt'
    exclude '.cache'
    exclude 'assets/create_enchantment_industry/lang/builtin/**'
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/client/java/**/*.java'
        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        importOrder()
        eclipse().configFile 'codeformat/formatter-config.xml'
        licenseHeaderFile 'codeformat/HEADER.txt'
    }
}

tasks.named('build').configure {
    dependsOn tasks.named('spotlessCheck')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "${mod_artifact_id}-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'DragonsPlus'
            url = 'https://maven.dragons.plus/releases'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

publishMods {
    file = jar.archiveFile
    additionalFiles.from sourcesJar.archiveFile
    changelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText
    version = mod_version
    type = me.modmuss50.mpp.ReleaseType.of(mod_release_channel)
    displayName = "CEI ${mod_version} for Create Fly ${create_fly_version}"
    modLoaders.add('fabric')
    dryRun = providers.environmentVariable('MOD_PUBLISH_DRY_RUN').map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = '688768'
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_25)
        client = true
        server = true
        requires('fabric-api', 'create-fly', 'create-dragons-plus')
        optional('jei')
    }

    modrinth {
        projectId = 'JWGBpFUP'
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        environment = CLIENT_AND_SERVER
        requires('fabric-api', 'create-fly', 'create-dragons-plus')
        optional('jei')
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
